# ~/.config/tmux/tmux.conf
# -------------------------------------------------------------------
# Core behaviour
# -------------------------------------------------------------------

# set delay between prefix and command
set -sg escape-time 1

# set prefix to C-a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# reload
bind r source-file ~/.config/tmux/tmux.conf \; display "~/.config/tmux/tmux.conf reloaded"

# base index 1
setw -g base-index 1
setw -g pane-base-index 1

# splits
bind | split-window -h
bind - split-window -v

# vim-like pane nav (tmux-native)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# cycle panes
bind -r C-j select-pane -t :.-
bind -r C-k select-pane -t :.+

# resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# mouse
set -g mouse on
bind m  set -g mouse on  \; display 'Mouse: ON'
bind M  set -g mouse off \; display 'Mouse: OFF'

# history
set -g history-limit 10000

# focus + activity
set -g focus-events on
setw -g monitor-activity on
set -g visual-activity on

# terminal / truecolor
set -g default-terminal "tmux-256color"
# more robust than only xterm-256color
set -as terminal-overrides ",*:Tc"

# -------------------------------------------------------------------
# Clipboard (Wayland)
# -------------------------------------------------------------------

set-window-option -g mode-keys vi

# Copy-mode selection (fix: use send-keys -X)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# Optional: Enter copies too (nice in vi copy-mode)
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"

# Paste from system clipboard into tmux buffer
bind p run-shell "wl-paste --no-newline | tmux load-buffer - \; tmux paste-buffer"

# -------------------------------------------------------------------
# Styling (transparent-friendly)
# -------------------------------------------------------------------
# NOTE: terminal transparency = "don't paint a background" => bg=default
# We'll keep your intentional filled blocks (like session name), but ensure
# global tmux surfaces don't force opaque slabs.

set -g status on
set -g status-justify left

# transparent base
set -g status-style "fg=colour4,bg=default"

# mode + messages (make transparent)
set -g mode-style "fg=colour4,bg=default"
set -g message-style "fg=colour4,bg=default"
set -g message-command-style "fg=colour4,bg=default"

# pane borders
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"

# lengths
set -g status-left-length 100
set -g status-right-length 100

set -g status-left-style NONE
set -g status-right-style NONE

# -------------------------------------------------------------------
# Status left/right
# -------------------------------------------------------------------
# Left: keep ONE transition from the session block into the (transparent) window list.
# This avoids the duplicate-triangle seam you’re seeing.
set -g status-left "#[fg=colour0,bg=colour4,bold] #S #[fg=colour4,bg=default,nobold,nounderscore,noitalics]"

# Right: keep your look, but ensure it’s consistent with bg=default where possible
set -g status-right "#{prefix_highlight} #[fg=colour8,bg=default]#[fg=colour4,bg=colour8] %I:%M %p #[fg=colour4,bg=colour8]#[fg=colour0,bg=colour4,bold] #h "

if-shell '[ "$(tmux show-option -gqv "clock-mode-style")" = "24" ]' {
  set -g status-right "#{prefix_highlight} #[fg=colour8,bg=default]#[fg=colour4,bg=colour8] %H:%M #[fg=colour4,bg=colour8]#[fg=colour0,bg=colour4,bold] #h "
}

# -------------------------------------------------------------------
# Window list formatting
# -------------------------------------------------------------------
# IMPORTANT: Remove the leading  from window formats to avoid duplicated triangles.
# The only left-hand transition is now the one at the end of status-left.

setw -g window-status-separator ""

setw -g window-status-style "fg=colour7,bg=default"
setw -g window-status-activity-style "underscore,fg=colour7,bg=default"

# Normal window
setw -g window-status-format " #[fg=colour7,bg=default]#I  #W #F "

# Current window: soft highlight block, but keep it seamless.
# (No leading triangle; it sits cleanly after status-left’s single .)
setw -g window-status-current-format " #[fg=colour4,bg=colour8,bold]#I  #W #F #[fg=default,bg=default,nobold] "

# -------------------------------------------------------------------
# tmux-plugins/tmux-prefix-highlight support
# -------------------------------------------------------------------
# Keep it, but don’t paint a background slab unless you want it.
set -g @prefix_highlight_output_prefix "#[fg=colour3,bg=default]#[fg=colour0,bg=colour3]"
set -g @prefix_highlight_output_suffix ""
